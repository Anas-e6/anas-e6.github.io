<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anas El Khaldi · Carta de presentació</title>
<meta name="description" content="Carta de presentació interactiva d’Anas El Khaldi, estudiant d’ASIX.">
<meta name="theme-color" content="#0f1012">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>

<body>
<noscript>Esta carta de presentación necesita JavaScript para funcionar. Actívalo en tu navegador y recarga la página.</noscript>

<!-- =================== PANTALLA DE SALIDA =================== -->
<div class="start" id="start">
  <div class="start__tag">
    <span class="dorsal" data-bind="dorsal"></span>
    <div>
      <h1 data-bind="nombreCompleto"></h1>
      <p>Carta de presentación interactiva</p>
    </div>
  </div>

  <div class="stack">
    <div class="gantry" id="gantry" aria-hidden="true"></div>
    <p class="start__status" id="status" role="status" aria-live="polite"></p>
    <button class="go" id="go" type="button" disabled><span>START</span></button>
  </div>

  <p class="start__hint" id="hint"></p>
  <div class="track" aria-hidden="true"></div>
  <div class="streaks" id="streaks" aria-hidden="true"></div>
</div>

<div class="wipe" id="wipe" aria-hidden="true"></div>

<!-- =================== APLICACIÓN =================== -->
<div class="app" id="app">

  <div class="topbar">
    <button class="topbar__btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="tower">
      <span class="row__pos" id="tbPos">P1</span>
      <span class="name" id="tbName"></span>
      <span class="time" id="tbTime"></span>
    </button>
  </div>
  <div class="scrim" id="scrim"></div>

  <!-- Menú = torre de clasificación -->
  <aside class="tower" id="tower" aria-label="Clasificación: navegación de la carta">
    <div class="tower__brand">
      <span class="dorsal" data-bind="dorsal"></span>
      <div>
        <strong data-bind="nombreCompleto"></strong>
        <span>Carta de presentación</span>
      </div>
    </div>
    <div class="tower__title">
      <h2>Clasificación</h2>
      <span id="lapCount"></span>
    </div>
    <nav><ol class="rows" id="rows"></ol></nav>
    <div class="circuit" id="circuit"><p>Recorrido de la carta</p></div>
    <p class="tower__keys">Cambia de vuelta con <kbd>←</kbd> <kbd>→</kbd> o las teclas <kbd>1</kbd>–<kbd>5</kbd></p>
  </aside>

  <main class="stage">
    <div class="laps" id="laps"></div>
    <div class="pager">
      <button class="pager__btn" id="prev" type="button"><span class="ico-slot"></span><span class="lbl"></span></button>
      <div class="pager__mid"><span id="lapLabel"></span><div class="dots" id="dots" aria-hidden="true"></div></div>
      <button class="pager__btn pager__btn--next" id="next" type="button"><span class="lbl"></span><span class="ico-slot"></span></button>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
